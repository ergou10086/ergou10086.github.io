<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    
    <filter id="tag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86868B" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5F5F7" />
  <circle cx="200" cy="200" r="300" fill="#E8F0FE" opacity="0.6" filter="blur(80px)" />
  <circle cx="600" cy="800" r="300" fill="#E6E6FA" opacity="0.5" filter="blur(80px)" />

  <g stroke="#86868B" stroke-width="2" fill="none">
    <path d="M 400 114 L 400 150" marker-end="url(#arrowhead)" />
    <path d="M 400 248 L 400 280" marker-end="url(#arrowhead)" />
    <path d="M 400 378 L 400 410" marker-end="url(#arrowhead)" />
    <path d="M 400 508 L 400 540" marker-end="url(#arrowhead)" />
    <path d="M 400 638 L 400 670" marker-end="url(#arrowhead)" />
    <path d="M 400 768 L 400 830" marker-end="url(#arrowhead)" />

    <path d="M 560 724 C 740 724, 740 204, 575 204" marker-end="url(#arrowhead)" stroke-dasharray="6,6" />
  </g>

  <rect x="240" y="50" width="320" height="64" rx="16" fill="#1D1D1F" filter="url(#card-shadow)" />
  <text x="400" y="88" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">目标 / 指令</text>

  <rect x="240" y="160" width="320" height="88" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="198" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">规划模块</text>
  <text x="400" y="226" font-size="14" font-weight="400" fill="#86868B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">分解任务，制定计划</text>

  <rect x="240" y="290" width="320" height="88" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="328" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">记忆模块</text>
  <text x="400" y="356" font-size="14" font-weight="400" fill="#86868B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">存储历史、知识、上下文</text>

  <rect x="240" y="420" width="320" height="88" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="458" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">工具调用模块</text>
  <text x="400" y="486" font-size="14" font-weight="400" fill="#86868B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">使用 API、搜索、计算等</text>

  <rect x="240" y="550" width="320" height="88" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="588" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">行动执行模块</text>
  <text x="400" y="616" font-size="14" font-weight="400" fill="#86868B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">运行代码、操作软件</text>

  <rect x="240" y="680" width="320" height="88" rx="20" fill="#FFFFFF" filter="url(#card-shadow)" />
  <text x="400" y="718" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">结果评估</text>
  <text x="400" y="746" font-size="14" font-weight="400" fill="#86868B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">校验执行状态是否达标</text>

  <rect x="240" y="840" width="320" height="64" rx="16" fill="url(#blue-gradient)" filter="url(#card-shadow)" />
  <text x="400" y="878" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">输出最终结果</text>

  <g transform="translate(365, 785)">
    <rect width="70" height="28" rx="14" fill="#FFFFFF" filter="url(#tag-shadow)" />
    <text x="35" y="19" font-size="13" font-weight="500" fill="#34C759" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">已完成</text>
  </g>

  <g transform="translate(630, 450)">
    <rect width="70" height="28" rx="14" fill="#FFFFFF" filter="url(#tag-shadow)" />
    <text x="35" y="19" font-size="13" font-weight="500" fill="#FF3B30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">未完成</text>
  </g>

</svg>
